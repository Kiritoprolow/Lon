<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blox Fruit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --panel: #0a0f1e;
    --border: #1a2a4a;
    --accent: #00d4ff;
    --accent2: #ff6b00;
    --online: #00ff88;
    --offline: #ff3355;
    --text: #c8d8f0;
    --muted: #4a6080;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(255,107,0,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
    padding: 24px 0;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    position: relative;
  }

  .logo::after {
    content: 'FRUIT TRACKER';
    display: block;
    font-size: clamp(10px, 2vw, 13px);
    letter-spacing: 8px;
    color: var(--muted);
    -webkit-text-fill-color: var(--muted);
    margin-top: 4px;
  }

  .refresh-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
    font-family: 'Orbitron', monospace;
    letter-spacing: 1px;
  }

  .refresh-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .player-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
    animation: fadeIn 0.4s ease both;
  }

  .player-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }

  .player-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  .player-card.online::before {
    background: linear-gradient(90deg, transparent, var(--online), transparent);
  }

  .player-card.offline::before {
    background: linear-gradient(90deg, transparent, var(--offline), transparent);
    opacity: 0.4;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .username {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-family: 'Orbitron', monospace;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 20px;
  }

  .status-badge.online {
    color: var(--online);
    background: rgba(0,255,136,0.1);
    border: 1px solid rgba(0,255,136,0.2);
  }

  .status-badge.offline {
    color: var(--offline);
    background: rgba(255,51,85,0.1);
    border: 1px solid rgba(255,51,85,0.2);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .online .status-dot { background: var(--online); animation: pulse 1.5s infinite; }
  .offline .status-dot { background: var(--offline); }

  .card-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.04);
  }

  .stat-icon {
    font-size: 18px;
    width: 28px;
    text-align: center;
  }

  .stat-info {
    flex: 1;
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Orbitron', monospace;
  }

  .stat-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-top: 1px;
  }

  .stat-value.fruit {
    color: var(--accent2);
  }

  .updated-time {
    font-size: 10px;
    color: var(--muted);
    font-family: 'Orbitron', monospace;
    letter-spacing: 1px;
    margin-top: 12px;
    text-align: right;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .empty-state p {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 2px;
  }

  .summary-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .summary-item {
    flex: 1;
    min-width: 120px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    text-align: center;
  }

  .summary-num {
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    font-weight: 900;
    line-height: 1;
  }

  .summary-num.total { color: var(--accent); }
  .summary-num.online-count { color: var(--online); }
  .summary-num.offline-count { color: var(--offline); }

  .summary-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
    font-family: 'Orbitron', monospace;
  }

  .loading {
    text-align: center;
    padding: 40px;
    font-family: 'Orbitron', monospace;
    color: var(--accent);
    letter-spacing: 3px;
    font-size: 13px;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  footer {
    text-align: center;
    padding: 24px 0;
    color: var(--muted);
    font-size: 11px;
    font-family: 'Orbitron', monospace;
    letter-spacing: 2px;
    border-top: 1px solid var(--border);
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <header>
    <div class="logo">BLOX FRUIT</div>
    <div class="refresh-bar">
      <div class="refresh-dot"></div>
      <span id="last-update">ĐANG TẢI...</span>
    </div>
  </header>

  <div class="summary-bar" id="summary" style="display:none">
    <div class="summary-item">
      <div class="summary-num total" id="total-count">0</div>
      <div class="summary-label">Tổng</div>
    </div>
    <div class="summary-item">
      <div class="summary-num online-count" id="online-count">0</div>
      <div class="summary-label">Online</div>
    </div>
    <div class="summary-item">
      <div class="summary-num offline-count" id="offline-count">0</div>
      <div class="summary-label">Offline</div>
    </div>
  </div>

  <div id="players-grid" class="stats-grid">
    <div class="loading">ĐANG KẾT NỐI...</div>
  </div>

  <footer>BLOX FRUIT TRACKER &nbsp;•&nbsp; AUTO REFRESH 30S</footer>
</div>

<script>
const SUPABASE_URL = 'https://tlvxpsqefouumvfdihbs.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsdnhwc3FlZm91dW12ZmRpaGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxODc1MDYsImV4cCI6MjA5NTc2MzUwNn0.2oYQQ2dOzH9i0W7wfYmJaostwqJj1MZCQl_ruG-HTUs';

function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (diff < 60) return diff + 's trước';
  if (diff < 3600) return Math.floor(diff/60) + 'm trước';
  if (diff < 86400) return Math.floor(diff/3600) + 'h trước';
  return Math.floor(diff/86400) + 'd trước';
}

function getFruitIcon(fruit) {
  if (!fruit || fruit === 'None') return '❌';
  const f = fruit.toLowerCase();
  if (f.includes('dragon')) return '🐉';
  if (f.includes('leopard')) return '🐆';
  if (f.includes('kitsune')) return '🦊';
  if (f.includes('sound')) return '🔊';
  if (f.includes('gas')) return '☁️';
  if (f.includes('buddha')) return '☯️';
  if (f.includes('string')) return '🕸️';
  if (f.includes('gravity')) return '🌀';
  if (f.includes('phoenix')) return '🔥';
  if (f.includes('light')) return '⚡';
  if (f.includes('dark')) return '🌑';
  if (f.includes('ice')) return '❄️';
  if (f.includes('magma')) return '🌋';
  if (f.includes('quake')) return '💥';
  if (f.includes('rubber')) return '🪃';
  return '🍎';
}

function renderCard(player, index) {
  const lastSeen = player.last_seen || player.updated_at;
  const secAgo = (Date.now() - new Date(lastSeen)) / 1000;
  const isOnline = player.status === 'online' && secAgo < 60;
  const fruit = player.fruit || 'None';
  return `
    <div class="player-card ${isOnline ? 'online' : 'offline'}" style="animation-delay:${index * 0.05}s">
      <div class="card-header">
        <div class="username">${player.username}</div>
        <div class="status-badge ${isOnline ? 'online' : 'offline'}">
          <div class="status-dot"></div>
          ${isOnline ? 'ONLINE' : 'OFFLINE'}
        </div>
      </div>
      <div class="card-body">
        <div class="stat-row">
          <div class="stat-icon">${getFruitIcon(fruit)}</div>
          <div class="stat-info">
            <div class="stat-label">Trái đang sở hữu</div>
            <div class="stat-value fruit">${fruit}</div>
          </div>
        </div>
      </div>
      <div class="updated-time">CẬP NHẬT ${timeAgo(player.updated_at)}</div>
    </div>
  `;
}

async function fetchPlayers() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/player_stats?select=*&order=status.asc,updated_at.desc`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    const data = await res.json();

    const grid = document.getElementById('players-grid');
    const summary = document.getElementById('summary');

    if (!data || data.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="icon">📡</div>
          <p>CHƯA CÓ DỮ LIỆU</p>
          <p style="margin-top:8px;font-size:11px">Chạy Lua script trong game để bắt đầu track</p>
        </div>`;
      return;
    }

    const onlineCount = data.filter(p => p.status === 'online').length;
    document.getElementById('total-count').textContent = data.length;
    document.getElementById('online-count').textContent = onlineCount;
    document.getElementById('offline-count').textContent = data.length - onlineCount;
    summary.style.display = 'flex';

    grid.innerHTML = data.map((p, i) => renderCard(p, i)).join('');
    document.getElementById('last-update').textContent = 
      'CẬP NHẬT LÚC ' + new Date().toLocaleTimeString('vi-VN');
  } catch(e) {
    document.getElementById('players-grid').innerHTML = 
      '<div class="loading">LỖI KẾT NỐI SUPABASE</div>';
  }
}

fetchPlayers();
setInterval(fetchPlayers, 30000);
</script>
</body>
</html>
