<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blox Fruit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--panel:#0a0f1e;--border:#1a2a4a;--accent:#00d4ff;--accent2:#ff6b00;--text:#c8d8f0;--muted:#4a6080;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 20% 20%,rgba(0,212,255,0.06) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 80%,rgba(255,107,0,0.05) 0%,transparent 60%);}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
  background-size:40px 40px;}
.container{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:20px 16px;}
header{text-align:center;margin-bottom:32px;padding:24px 0;}
.logo{font-family:'Orbitron',monospace;font-size:clamp(22px,5vw,36px);font-weight:900;letter-spacing:4px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo::after{content:'FRUIT TRACKER';display:block;font-size:clamp(10px,2vw,13px);letter-spacing:8px;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:4px;}
.refresh-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;font-size:13px;color:var(--muted);font-family:'Orbitron',monospace;letter-spacing:1px;}
.refresh-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.8);}}
.summary-bar{display:flex;gap:16px;margin-bottom:24px;}
.summary-item{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 18px;text-align:center;}
.summary-num{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;line-height:1;color:var(--accent);}
.summary-label{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px;font-family:'Orbitron',monospace;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:24px;}
.player-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;
  transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;animation:fadeIn 0.4s ease both;}
.player-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 32px rgba(0,212,255,0.12);}
.player-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.7;}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.fruit-banner{position:relative;height:110px;background:linear-gradient(135deg,#0d1628,#111c35);
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.fruit-banner::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,212,255,0.08),transparent 70%);}
.fruit-banner-img{width:88px;height:88px;object-fit:contain;position:relative;z-index:1;
  filter:drop-shadow(0 0 14px rgba(0,212,255,0.35));transition:transform 0.3s,filter 0.3s;}
.player-card:hover .fruit-banner-img{transform:scale(1.08);filter:drop-shadow(0 0 22px rgba(0,212,255,0.55));}
.fruit-banner-emoji{font-size:56px;position:relative;z-index:1;line-height:1;}
.fruit-banner-label{position:absolute;bottom:8px;right:10px;z-index:2;font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1.5px;color:var(--accent);opacity:0.7;}
.fruit-banner.mythical::after{background:radial-gradient(ellipse at center,rgba(255,107,0,0.14),transparent 70%);}
.fruit-banner.mythical .fruit-banner-img{filter:drop-shadow(0 0 16px rgba(255,107,0,0.5));}
.fruit-banner.legendary::after{background:radial-gradient(ellipse at center,rgba(255,200,0,0.13),transparent 70%);}
.fruit-banner.legendary .fruit-banner-img{filter:drop-shadow(0 0 16px rgba(255,200,0,0.45));}
.fruit-banner.rare::after{background:radial-gradient(ellipse at center,rgba(180,80,255,0.13),transparent 70%);}
.fruit-banner.rare .fruit-banner-img{filter:drop-shadow(0 0 16px rgba(180,80,255,0.45));}
.card-body-wrap{padding:16px 18px 14px;}
.card-header{margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.username{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:1px;color:#fff;}
.level-badge{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;
  background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.3);
  color:var(--accent);padding:3px 8px;border-radius:20px;letter-spacing:1px;}
.card-stats{display:flex;flex-direction:column;gap:7px;}
.stat-row{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid rgba(255,255,255,0.04);}
.stat-icon{font-size:15px;width:22px;text-align:center;margin-top:2px;}
.stat-info{flex:1;}
.stat-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:'Orbitron',monospace;}
.stat-value{font-size:14px;font-weight:600;color:var(--text);margin-top:1px;}
.stat-value.fruit-text{color:var(--accent2);}
.updated-time{font-size:10px;color:var(--muted);font-family:'Orbitron',monospace;letter-spacing:1px;margin-top:10px;text-align:right;}
.inv-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.inv-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
  border-radius:8px;padding:6px 5px;width:62px;transition:border-color 0.2s,background 0.2s;}
.inv-item:hover{background:rgba(0,212,255,0.08);border-color:rgba(0,212,255,0.3);}
.inv-item img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 5px rgba(0,212,255,0.25));}
.inv-item .inv-emoji{font-size:26px;line-height:1;}
.inv-item .inv-name{font-family:'Orbitron',monospace;font-size:6px;color:var(--muted);letter-spacing:0;text-align:center;line-height:1.2;word-break:break-all;max-width:62px;}
.inv-empty{font-size:12px;color:var(--muted);margin-top:4px;}
.section-block{margin-bottom:20px;}
.section-title{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';display:inline-block;width:3px;height:14px;background:var(--accent);border-radius:2px;}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 10px;transition:border-color 0.2s;}
.chip:hover{border-color:var(--accent);}
.chip img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(0,212,255,0.3));}
.chip-emoji{font-size:22px;line-height:1;}
.chip-info{display:flex;flex-direction:column;}
.chip-name{font-family:'Orbitron',monospace;font-size:7px;color:var(--muted);letter-spacing:0.5px;line-height:1.3;}
.chip-num{font-family:'Orbitron',monospace;font-size:16px;font-weight:900;color:var(--accent);line-height:1;}
.chip-num.zero{color:var(--muted);}
.delete-btn{margin-top:10px;width:100%;padding:7px;background:rgba(255,50,50,0.08);border:1px solid rgba(255,50,50,0.25);border-radius:8px;color:#ff4444;font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;transition:background 0.2s;}
.delete-btn:hover{background:rgba(255,50,50,0.2);border-color:rgba(255,50,50,0.6);}
.confirm-bar{display:none;margin-top:8px;gap:8px;}
.confirm-bar.show{display:flex;}
.confirm-bar button{flex:1;padding:7px;border-radius:8px;font-family:'Orbitron',monospace;font-size:10px;cursor:pointer;border:1px solid;}
.btn-yes{background:rgba(255,50,50,0.15);border-color:rgba(255,50,50,0.5);color:#ff4444;}
.btn-no{background:rgba(0,212,255,0.08);border-color:rgba(0,212,255,0.3);color:var(--accent);}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1;}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:0.5;}
.empty-state p{font-family:'Orbitron',monospace;font-size:13px;letter-spacing:2px;}
.loading{text-align:center;padding:40px;font-family:'Orbitron',monospace;color:var(--accent);letter-spacing:3px;font-size:13px;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
footer{text-align:center;padding:24px 0;color:var(--muted);font-size:11px;font-family:'Orbitron',monospace;letter-spacing:2px;border-top:1px solid var(--border);margin-top:16px;}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <header>
    <div class="logo">BLOX FRUIT</div>
    <div class="refresh-bar"><div class="refresh-dot"></div><span id="last-update">ĐANG TẢI...</span></div>
  </header>
  <div class="summary-bar" id="summary" style="display:none">
    <div class="summary-item"><div class="summary-num" id="total-count">0</div><div class="summary-label">TỔNG TÀI KHOẢN</div></div>
  </div>
  <div class="section-block" id="fruit-section" style="display:none">
    <div class="section-title">RARE FRUITS</div>
    <div class="chips-row" id="fruit-chips"></div>
  </div>
  <div class="section-block" id="weapon-section" style="display:none">
    <div class="section-title">VŨ KHÍ ĐẶC BIỆT</div>
    <div class="chips-row" id="weapon-chips"></div>
  </div>
  <div id="players-grid" class="stats-grid"><div class="loading">ĐANG KẾT NỐI...</div></div>
  <footer>BLOX FRUIT TRACKER &nbsp;•&nbsp; AUTO REFRESH 30S</footer>
</div>
<script>
var SURL = 'https://tlvxpsqefouumvfdihbs.supabase.co';
var SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsdnhwc3FlZm91dW12ZmRpaGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxODc1MDYsImV4cCI6MjA5NTc2MzUwNn0.2oYQQ2dOzH9i0W7wfYmJaostwqJj1MZCQl_ruG-HTUs';
var BASE = 'https://raw.githubusercontent.com/Kiritoprolow/Lon/858a83b6c0cf790e32c78986f248e91963de4052/';

var FRUIT_MAP = {
  dragon:   {img:BASE+'Dragon_Fruit.webp',    rarity:'mythical'},
  kitsune:  {img:BASE+'Kitsune_Fruit.webp',   rarity:'mythical'},
  spirit:   {img:BASE+'Spirit_Fruit.webp',    rarity:'mythical'},
  yeti:     {img:BASE+'Yeti_Fruit.webp',      rarity:'mythical'},
  trex:     {img:BASE+'T-Rex_Fruit.webp',     rarity:'mythical'},
  buddha:   {img:BASE+'Buddha_Fruit.webp',    rarity:'legendary'},
  dough:    {img:BASE+'Dough_Fruit.webp',     rarity:'legendary'},
  phoenix:  {img:BASE+'Phoenix_Fruit.webp',   rarity:'legendary'},
  sound:    {img:BASE+'Sound_Fruit.webp',     rarity:'legendary'},
  shadow:   {img:BASE+'Shadow_Fruit.webp',    rarity:'legendary'},
  pain:     {img:BASE+'Pain_Fruit.webp',      rarity:'legendary'},
  quake:    {img:BASE+'Quake_Fruit.webp',     rarity:'legendary'},
  creation: {img:BASE+'Creation_Fruit.webp',  rarity:'legendary'},
  venom:    {img:BASE+'Venom_Fruit.webp',     rarity:'legendary'},
  mammoth:  {img:BASE+'Mammoth_Fruit.webp',   rarity:'legendary'},
  lightning:{img:BASE+'Lightning_Fruit.webp', rarity:'legendary'},
  portal:   {img:BASE+'Portal_Fruit.webp',    rarity:'legendary'},
  control:  {img:BASE+'Control_Fruit.webp',   rarity:'legendary'},
  gravity:  {img:BASE+'Gravity_Fruit.webp',   rarity:'rare'},
  gas:      {img:BASE+'Gas_Fruit.webp',       rarity:'rare'},
  spider:   {img:BASE+'Spider_Fruit.webp',    rarity:'rare'},
  tiger:    {img:BASE+'Tiger_Fruit.webp',     rarity:'rare'},
  love:     {img:BASE+'Love_Fruit.webp',      rarity:'rare'},
  blizzard: {img:BASE+'Blizzard_Fruit.webp',  rarity:'rare'}
};

var MELEE_MAP = {
  'death step':      BASE+'Death_Step.webp',
  'dragon talon':    BASE+'Dragon_Talon.webp',
  'electric claw':   BASE+'Electric_Claw.webp',
  'godhuman':        BASE+'Godhuman.webp',
  'god human':       BASE+'Godhuman.webp',
  'sanguine art':    BASE+'Sanguine_Art.webp',
  'sharkman karate': BASE+'Sharkman_Karate.webp',
  'superhuman':      BASE+'Superhuman.webp'
};

var TRACKED_FRUITS = [
  {key:'lightning', label:'Lightning', img:BASE+'Lightning_Fruit.webp'},
  {key:'tiger',     label:'Tiger',     img:BASE+'Tiger_Fruit.webp'},
  {key:'yeti',      label:'Yeti',      img:BASE+'Yeti_Fruit.webp'},
  {key:'kitsune',   label:'Kitsune',   img:BASE+'Kitsune_Fruit.webp'}
];

var TRACKED_WEAPONS = [
  {key:'cursed dual katana', label:'CDK',          img:BASE+'Cursed_Dual_Katana.webp'},
  {key:'skull guitar',       label:'Skull Guitar', img:BASE+'Skull_Guitar.webp'}
];

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getFruitData(name) {
  if (!name || name.toLowerCase()==='none') return null;
  var low = name.toLowerCase();
  for (var k in FRUIT_MAP) {
    if (low.indexOf(k) >= 0) return {img:FRUIT_MAP[k].img, rarity:FRUIT_MAP[k].rarity};
  }
  return null;
}

function getFruitEmoji(name) {
  var f = (name||'').toLowerCase();
  if (f.indexOf('dragon')>=0)    return '🐉';
  if (f.indexOf('kitsune')>=0)   return '🦊';
  if (f.indexOf('spirit')>=0)    return '👻';
  if (f.indexOf('yeti')>=0)      return '⛄';
  if (f.indexOf('rex')>=0)       return '🦖';
  if (f.indexOf('buddha')>=0)    return '☯️';
  if (f.indexOf('dough')>=0)     return '🫓';
  if (f.indexOf('phoenix')>=0)   return '🔥';
  if (f.indexOf('sound')>=0)     return '🔊';
  if (f.indexOf('shadow')>=0)    return '👤';
  if (f.indexOf('pain')>=0)      return '💀';
  if (f.indexOf('quake')>=0)     return '💥';
  if (f.indexOf('creation')>=0)  return '✨';
  if (f.indexOf('venom')>=0)     return '🐍';
  if (f.indexOf('mammoth')>=0)   return '🦣';
  if (f.indexOf('lightning')>=0) return '⚡';
  if (f.indexOf('portal')>=0)    return '🌀';
  if (f.indexOf('control')>=0)   return '🎮';
  if (f.indexOf('gravity')>=0)   return '🌀';
  if (f.indexOf('gas')>=0)       return '☁️';
  if (f.indexOf('spider')>=0)    return '🕷️';
  if (f.indexOf('tiger')>=0)     return '🐯';
  if (f.indexOf('love')>=0)      return '💗';
  if (f.indexOf('blizzard')>=0)  return '❄️';
  return '🍎';
}

function getMeleeImg(name) {
  var low = (name||'').toLowerCase();
  for (var k in MELEE_MAP) {
    if (low.indexOf(k) >= 0) return MELEE_MAP[k];
  }
  return '';
}

function getMeleeEmoji(name) {
  var f = (name||'').toLowerCase();
  if (f.indexOf('god')>=0)      return '🥊';
  if (f.indexOf('death')>=0)    return '🔥';
  if (f.indexOf('dragon')>=0)   return '🐉';
  if (f.indexOf('electric')>=0) return '⚡';
  if (f.indexOf('shark')>=0)    return '🦈';
  if (f.indexOf('super')>=0)    return '👊';
  if (f.indexOf('sanguine')>=0) return '🌹';
  return '👊';
}

function imgTag(src, alt, cls) {
  var c = cls ? ' class="'+cls+'"' : '';
  return '<img'+c+' src="'+esc(src)+'" alt="'+esc(alt)+'" onerror="this.style.display=\'none\';if(this.nextSibling)this.nextSibling.style.display=\'inline\'">';
}

function makeGrid(items, getImg, getEmoji) {
  var h = '<div class="inv-grid">';
  for (var i=0; i<items.length; i++) {
    var n = items[i];
    var url = getImg(n);
    var inner = url
      ? imgTag(url,n,'') + '<span class="inv-emoji" style="display:none">'+getEmoji(n)+'</span>'
      : '<span class="inv-emoji">'+getEmoji(n)+'</span>';
    h += '<div class="inv-item" title="'+esc(n)+'">'+inner+'<span class="inv-name">'+esc(n.toUpperCase())+'</span></div>';
  }
  return h + '</div>';
}

function renderBanner(fruit) {
  if (!fruit || fruit.toLowerCase()==='none') return '';
  var d = getFruitData(fruit);
  var rarity = d ? d.rarity : 'common';
  var inner = d && d.img
    ? imgTag(d.img, fruit, 'fruit-banner-img') + '<span class="fruit-banner-emoji" style="display:none">'+getFruitEmoji(fruit)+'</span>'
    : '<span class="fruit-banner-emoji">'+getFruitEmoji(fruit)+'</span>';
  return '<div class="fruit-banner '+rarity+'">'+inner+'<span class="fruit-banner-label">'+esc(fruit.toUpperCase())+'</span></div>';
}

function renderGrid(str, getImg, getEmoji) {
  if (!str || !str.trim()) return '<span class="inv-empty">Không có</span>';
  var items = str.split(/[\n,]+/).map(function(s){return s.trim();}).filter(Boolean);
  return items.length ? makeGrid(items, getImg, getEmoji) : '<span class="inv-empty">Không có</span>';
}

function renderCard(p, idx) {
  var fruit = (p.fruit||'None').trim();
  var meleeRow = '';
  if (p.melee && p.melee.trim()) {
    meleeRow = '<div class="stat-row"><div class="stat-icon">👊</div><div class="stat-info">'
      + '<div class="stat-label">Melee</div>'
      + renderGrid(p.melee, getMeleeImg, getMeleeEmoji)
      + '</div></div>';
  }
  var invRow = '';
  if (p.inventory && p.inventory.trim()) {
    invRow = '<div class="stat-row"><div class="stat-icon">⚔️</div><div class="stat-info">'
      + '<div class="stat-label">Vũ khí</div>'
      + '<div class="stat-value">'+esc(p.inventory)+'</div>'
      + '</div></div>';
  }
  var uname = esc(p.username);
  return '<div class="player-card" style="animation-delay:'+(idx*0.05)+'s">'
    + renderBanner(fruit)
    + '<div class="card-body-wrap">'
    + '<div class="card-header"><div class="username">'+uname+'</div><div class="level-badge">LV '+(p.level||0)+'</div></div>'
    + '<div class="card-stats">'
    + '<div class="stat-row"><div class="stat-icon">🧬</div><div class="stat-info"><div class="stat-label">Race</div><div class="stat-value">'+esc((p.race||'Unknown').trim())+'</div></div></div>'
    + '<div class="stat-row"><div class="stat-icon">🍎</div><div class="stat-info"><div class="stat-label">Trái đang dùng</div><div class="stat-value fruit-text">'+esc(fruit)+'</div></div></div>'
    + '<div class="stat-row"><div class="stat-icon">🎒</div><div class="stat-info"><div class="stat-label">Kho trái</div>'
    + renderGrid(p.inventory_fruits||'', function(n){var d=getFruitData(n);return d?d.img:'';}, getFruitEmoji)
    + '</div></div>'
    + meleeRow + invRow
    + '</div>'
    + "<div class=\"updated-time\">CẬP NHẬT " + timeAgo(p.last_seen||p.updated_at) + "</div>"
    + "<button class=\"delete-btn\" onclick=\"showConfirm(this)\">🗑 XÓA</button>"
    + "<div class=\"confirm-bar\">"
    + "<button class=\"btn-yes\" data-user=\"" + esc(p.username) + "\" onclick=\"deleteAcc(this)\">✔️ XÁC NHẬN</button>"
    + "<button class=\"btn-no\" onclick=\"hideConfirm(this)\">❌ HỦY</button>"
    + '</div>'
    + '</div></div>';
}

function showConfirm(btn) {
  btn.nextElementSibling.classList.add('show');
  btn.style.display = 'none';
}

function hideConfirm(btn) {
  var bar = btn.parentElement;
  bar.classList.remove('show');
  bar.previousElementSibling.style.display = 'block';
}

async function deleteAcc(btn) {
  var card = btn.closest('.player-card');
  var username = card.querySelector('.username').textContent;
  btn.textContent = '...';
  try {
    var res = await fetch(SURL + '/rest/v1/player_stats?username=eq.' + encodeURIComponent(username), {
      method: 'DELETE',
      headers: {apikey: SKEY, Authorization: 'Bearer ' + SKEY, Prefer: 'return=minimal'}
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    card.style.transition = 'opacity 0.3s';
    card.style.opacity = '0';
    setTimeout(function(){ card.remove(); }, 300);
  } catch(e) {
    btn.textContent = 'LỖI!';
  }
}

function makeChip(item, count) {
  var inner = item.img
    ? imgTag(item.img, item.label, '') + '<span class="chip-emoji" style="display:none">🍎</span>'
    : '<span class="chip-emoji">⚔️</span>';
  return '<div class="chip">'+inner
    + '<div class="chip-info"><span class="chip-name">'+esc(item.label)+'</span>'
    + '<span class="chip-num'+(count===0?' zero':'')+'">'+count+'</span>'
    + '</div></div>';
}

function buildSummary(data) {
  var fc = {};
  TRACKED_FRUITS.forEach(function(f){ fc[f.key]=0; });
  data.forEach(function(p) {
    var txt = ((p.inventory_fruits||'')+','+(p.fruit||'')).toLowerCase();
    TRACKED_FRUITS.forEach(function(f) {
      var m = txt.match(new RegExp(f.key,'g'));
      if (m) fc[f.key] += m.length;
    });
  });
  document.getElementById('fruit-chips').innerHTML = TRACKED_FRUITS.map(function(f){ return makeChip(f,fc[f.key]); }).join('');
  document.getElementById('fruit-section').style.display = 'block';

  var wc = {};
  TRACKED_WEAPONS.forEach(function(w){ wc[w.key]=0; });
  data.forEach(function(p) {
    var inv = (p.inventory||'').toLowerCase();
    TRACKED_WEAPONS.forEach(function(w) {
      if (inv.indexOf(w.key)>=0) wc[w.key]++;
    });
  });
  document.getElementById('weapon-chips').innerHTML = TRACKED_WEAPONS.map(function(w){ return makeChip(w,wc[w.key]); }).join('');
  document.getElementById('weapon-section').style.display = 'block';
}

function timeAgo(ds) {
  if (!ds) return 'N/A';
  var d = new Date(ds.replace('+00','').replace(' ','T').split('.')[0]+'Z');
  if (isNaN(d)) return 'N/A';
  var s = Math.floor((Date.now()-d)/1000);
  if (s<60)    return s+'s trước';
  if (s<3600)  return Math.floor(s/60)+'m trước';
  if (s<86400) return Math.floor(s/3600)+'h trước';
  return Math.floor(s/86400)+'d trước';
}

async function fetchPlayers() {
  try {
    var res = await fetch(SURL+'/rest/v1/player_stats?select=*&order=updated_at.desc', {
      headers: {apikey:SKEY, Authorization:'Bearer '+SKEY}
    });
    if (!res.ok) throw new Error('HTTP '+res.status);
    var data = await res.json();
    var grid = document.getElementById('players-grid');
    if (!data||!data.length) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">📡</div><p>CHƯA CÓ DỮ LIỆU</p></div>';
      return;
    }
    document.getElementById('total-count').textContent = data.length;
    document.getElementById('summary').style.display = 'flex';
    buildSummary(data);
    grid.innerHTML = data.map(renderCard).join('');
    var vn = new Date(Date.now()+7*3600*1000);
    document.getElementById('last-update').textContent = 'CẬP NHẬT LÚC '+vn.toISOString().slice(11,19)+' (ICT)';
  } catch(e) {
    document.getElementById('players-grid').innerHTML = '<div class="loading">LỖI: '+e.message+'</div>';
  }
}

fetchPlayers();
setInterval(fetchPlayers,30000);
</script>
