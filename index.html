<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blox Fruit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810; --panel: #0a0f1e; --border: #1a2a4a;
    --accent: #00d4ff; --accent2: #ff6b00; --text: #c8d8f0; --muted: #4a6080;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(255,107,0,0.05) 0%, transparent 60%);
  }
  .grid-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px 16px; }
  header { text-align: center; margin-bottom: 32px; padding: 24px 0; }
  .logo {
    font-family: 'Orbitron', monospace; font-size: clamp(22px, 5vw, 36px);
    font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .logo::after {
    content: 'FRUIT TRACKER'; display: block; font-size: clamp(10px, 2vw, 13px);
    letter-spacing: 8px; color: var(--muted); -webkit-text-fill-color: var(--muted); margin-top: 4px;
  }
  .refresh-bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; font-size: 13px; color: var(--muted); font-family: 'Orbitron', monospace; letter-spacing: 1px; }
  .refresh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
  .summary-bar { display: flex; gap: 16px; margin-bottom: 24px; }
  .summary-item { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; text-align: center; }
  .summary-num { font-family: 'Orbitron', monospace; font-size: 28px; font-weight: 900; line-height: 1; color: var(--accent); }
  .summary-label { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; font-family: 'Orbitron', monospace; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .player-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; position: relative; overflow: hidden;
    transition: transform 0.2s, border-color 0.2s; animation: fadeIn 0.4s ease both;
  }
  .player-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .player-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.6;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .card-header { margin-bottom: 16px; }
  .username { font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #fff; }
  .card-body { display: flex; flex-direction: column; gap: 8px; }
  .stat-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); }
  .stat-icon { font-size: 16px; width: 24px; text-align: center; margin-top: 2px; }
  .stat-info { flex: 1; }
  .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; font-family: 'Orbitron', monospace; }
  .stat-value { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 1px; }
  .stat-value.fruit { color: var(--accent2); }
  .stat-value.inv { color: #a0b8d0; font-size: 12px; line-height: 1.6; }
  .updated-time { font-size: 10px; color: var(--muted); font-family: 'Orbitron', monospace; letter-spacing: 1px; margin-top: 10px; text-align: right; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); grid-column: 1/-1; }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state p { font-family: 'Orbitron', monospace; font-size: 13px; letter-spacing: 2px; }
  .loading { text-align: center; padding: 40px; font-family: 'Orbitron', monospace; color: var(--accent); letter-spacing: 3px; font-size: 13px; animation: blink 1s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  footer { text-align: center; padding: 24px 0; color: var(--muted); font-size: 11px; font-family: 'Orbitron', monospace; letter-spacing: 2px; border-top: 1px solid var(--border); margin-top: 16px; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <header>
    <div class="logo">BLOX FRUIT</div>
    <div class="refresh-bar">
      <div class="refresh-dot"></div>
      <span id="last-update">ĐANG TẢI...</span>
    </div>
  </header>
  <div class="summary-bar" id="summary" style="display:none">
    <div class="summary-item">
      <div class="summary-num" id="total-count">0</div>
      <div class="summary-label">Tổng tài khoản</div>
    </div>
  </div>
  <div id="players-grid" class="stats-grid">
    <div class="loading">ĐANG KẾT NỐI...</div>
  </div>
  <footer>BLOX FRUIT TRACKER &nbsp;•&nbsp; AUTO REFRESH 30S</footer>
</div>
<script>
const SUPABASE_URL = 'https://tlvxpsqefouumvfdihbs.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsdnhwc3FlZm91dW12ZmRpaGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxODc1MDYsImV4cCI6MjA5NTc2MzUwNn0.2oYQQ2dOzH9i0W7wfYmJaostwqJj1MZCQl_ruG-HTUs';

function timeAgo(dateStr) {
  if (!dateStr) return 'N/A';
  // Parse thủ công không dùng Date()
  const clean = dateStr.replace('+00', '').replace(' ', 'T').split('.')[0];
  const d = new Date(clean + 'Z');
  if (isNaN(d)) return 'N/A';
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return diff + 's trước';
  if (diff < 3600) return Math.floor(diff/60) + 'm trước';
  if (diff < 86400) return Math.floor(diff/3600) + 'h trước';
  return Math.floor(diff/86400) + 'd trước';
}

function getFruitIcon(fruit) {
  if (!fruit || fruit === 'None') return '❌';
  const f = fruit.toLowerCase();
  if (f.includes('dragon')) return '🐉';
  if (f.includes('leopard')) return '🐆';
  if (f.includes('kitsune')) return '🦊';
  if (f.includes('sound')) return '🔊';
  if (f.includes('gas')) return '☁️';
  if (f.includes('buddha')) return '☯️';
  if (f.includes('string')) return '🕸️';
  if (f.includes('gravity')) return '🌀';
  if (f.includes('phoenix')) return '🔥';
  if (f.includes('light')) return '⚡';
  if (f.includes('dark')) return '🌑';
  if (f.includes('ice')) return '❄️';
  if (f.includes('magma')) return '🌋';
  if (f.includes('quake')) return '💥';
  if (f.includes('dough')) return '🫓';
  if (f.includes('shadow')) return '👤';
  if (f.includes('pain')) return '💀';
  if (f.includes('spirit')) return '👻';
  if (f.includes('yeti')) return '⛄';
  if (f.includes('tiger')) return '🐯';
  if (f.includes('spider')) return '🕷️';
  if (f.includes('creation')) return '✨';
  return '🍎';
}

function formatInvFruits(inv) {
  if (!inv || inv.trim() === '') return 'Không có';
  return inv.split('\n').filter(s => s.trim()).join(', ');
}

function renderCard(player, index) {
  const fruit = (player.fruit || 'None').trim();
  const level = player.level || 0;
  const race = (player.race || 'Unknown').trim();
  const invFruits = formatInvFruits(player.inventory_fruits || '');
  const updated = player.last_seen || player.updated_at;

  return `
    <div class="player-card" style="animation-delay:${index * 0.05}s">
      <div class="card-header">
        <div class="username">${player.username}</div>
      </div>
      <div class="card-body">
        <div class="stat-row">
          <div class="stat-icon">⚔️</div>
          <div class="stat-info">
            <div class="stat-label">Level</div>
            <div class="stat-value">${level}</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">🧬</div>
          <div class="stat-info">
            <div class="stat-label">Race</div>
            <div class="stat-value">${race}</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">${getFruitIcon(fruit)}</div>
          <div class="stat-info">
            <div class="stat-label">Trái đang dùng</div>
            <div class="stat-value fruit">${fruit}</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">🎒</div>
          <div class="stat-info">
            <div class="stat-label">Kho trái</div>
            <div class="stat-value inv">${invFruits}</div>
          </div>
        </div>
      </div>
      <div class="updated-time">CẬP NHẬT ${timeAgo(updated)}</div>
    </div>
  `;
}

async function fetchPlayers() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/player_stats?select=*&order=updated_at.desc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    const data = await res.json();
    const grid = document.getElementById('players-grid');
    const summary = document.getElementById('summary');

    if (!data || data.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">📡</div><p>CHƯA CÓ DỮ LIỆU</p></div>';
      return;
    }

    document.getElementById('total-count').textContent = data.length;
    summary.style.display = 'flex';
    grid.innerHTML = data.map((p, i) => renderCard(p, i)).join('');

    const nowVN = new Date(Date.now() + 7 * 3600 * 1000);
    document.getElementById('last-update').textContent = 'CẬP NHẬT LÚC ' + nowVN.toISOString().slice(11,19) + ' (ICT)';
  } catch(e) {
    document.getElementById('players-grid').innerHTML = '<div class="loading">LỖI KẾT NỐI</div>';
  }
}

fetchPlayers();
setInterval(fetchPlayers, 30000);
</script>
</body>
</html>
